[project]
name = "tableau-ai-prep"
version = "0.1.0"
description = "AI-driven alternative to Tableau Prep: NL -> plan -> human approval -> Hyper extract -> Tableau publish"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=0.34",
    "cryptography>=42.0",
    "pantab>=4.1",
    "tableauhyperapi>=0.0.19484",
    "tableauserverclient>=0.32",
    "sqlglot>=25.0",
    "pandas>=2.2",
    "psycopg2-binary>=2.9",
    "pymysql>=1.1",
    "tenacity>=8.5",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "croniter>=2.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
